<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브릿지카페 단골 적립</title>

  <!-- ╔════════════════════════════════════════════════════════════════╗
       ║  ★★★  설정과 연습용 손님 정보  ★★★   고칠 때는 이 칸만 보세요!  ║
       ╚════════════════════════════════════════════════════════════════╝

       ■ 이 화면이 스탬프 개수를 가져오는 곳 (위에서부터 먼저 해당하는 것 하나만 쓰여요)
         1) 아래 "서버주소"를 채웠으면      → 구글 스프레드시트 장부 (지금은 쓰지 않아요. 비워 두세요.)
         2) 아래 "연습모드"가 true 이면     → 연습용 가짜 손님 목록 (데모·화면 확인용)
         3) 둘 다 아니면 (지금 설정)         → "이 기기에 저장된 사장님 기록"을 읽어요.
            · 사장님 화면(admin.html)과 이 화면(index.html)을 "같은 인터넷 주소(같은 폴더)"에 두고,
              "사장님 기기"에서 열면 → 손님이 번호를 넣었을 때 진짜 개수가 나와요.
            · 손님이 "자기 휴대폰"으로 열면 → 그 휴대폰에는 사장님 기록이 없으니, 틀린 "0개"를 보여주는 대신
              "스탬프는 가게에서 확인해 드려요" 안내가 나와요.

       ■ 꼭 지켜주세요 (개인정보 안전)
         ⚠ 진짜 손님의 전화번호를 이 파일에 적지 마세요!
           이 파일을 인터넷에 올리면 누구나 "소스 보기"로 안의 글자를 읽을 수 있어요.
           (연습용 가짜 번호만 쓰세요.)
         ⚠ 사장님 비밀번호도 이 파일에 적지 마세요. (손님 화면에는 필요 없어요.)

       ■ 가짜 손님 추가·수정하는 법 (연습모드에서만 쓰여요)
         아래 "연습용 가짜 손님" 안의 한 줄이 손님 한 명이에요.
             "1111": 3,
              └ 번호 뒷 4자리(큰따옴표 안, 숫자 4개)   └ 모은 스탬프 개수(숫자만)
         · 줄 맨 끝의 쉼표(,)를 꼭 붙이세요.
         · 고친 뒤에는 저장(Ctrl + S) → 브라우저 새로고침(F5)으로 확인하세요.

       ■ 다른 설정
         · 가게 이름, 보상, 몇 개를 모아야 하는지도 아래 "기본 설정"에서 바꿔요.
       ═══════════════════════════════════════════════════════════════════ -->
  <script>
    /* ----- 기본 설정 (큰따옴표 안의 글자, 숫자만 바꾸세요) ----- */
    const 가게이름   = "브릿지카페";
    const 목표개수   = 10;                       // 몇 개를 모으면 보상을 받는지 (동그라미 개수도 같이 바뀌어요)
    const 보상       = "아메리카노 1잔 무료";   // 다 모았을 때 받는 선물
    const 적립방법   = "음료 1잔당 스탬프 1개"; // 맨 위 안내 문구

    /* ----- 연습모드 -----
       false = 사장님 기기에 저장된 진짜 기록을 읽어요 (지금 설정)
       true  = 아래 "연습용 가짜 손님"으로 화면만 보여줘요 (축하 화면 등을 미리 볼 때) */
    const 연습모드   = false;

    /* ----- 사장님 기록이 저장된 이름 -----
       ※ admin.html 의 "저장이름" 과 반드시 똑같아야 해요. (바꾸면 기록을 못 찾아요!) */
    const 저장이름   = "bridgecafe-stamp-admin-v1";

    /* ----- 구글 장부 연결 (지금은 쓰지 않아요. 비워 두세요) -----
       예) "https://script.google.com/macros/s/AKfy.../exec" */
    const 서버주소   = "";

    /* ----- 새로고침해도 번호 기억 -----
       true  = 확인한 번호를 "이 기기의 이 탭 안에만" 잠깐 기억해요. 새로고침하면 번호를 다시 안 넣어도 개수가 나와요.
       false = 번호를 전혀 기억하지 않아요. (가장 안전, 지금 설정)
       ※ 가게 공용 기기에서는 다음 손님에게 앞 손님 번호가 이어지지 않게 false 로 두세요. */
    const 새로고침해도기억 = false;

    /* ----- 연습용 가짜 손님 (번호 뒷 4자리 : 스탬프 개수) ----- */
    const 연습손님 = {
      "1111": 3,    // 3개 모은 손님
      "2222": 7,    // 7개 모은 손님
      "3333": 10,   // 10개 다 모은 손님 → 축하 화면이 나와요
      "4444": 0     // 아직 하나도 없는 손님
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* ===== 색깔 설정 (색을 바꾸고 싶으면 여기 # 숫자만 바꾸세요) ===== */
    :root {
      --sky:        #CFE8F7;
      --sky-mid:    #E3F1F8;
      --cream:      #F5EFE6;
      --sky-strong: #3F86B8;
      --ink:        #2F4A5E;
      --ink-soft:   #52697A;
      --gold:       #E9B44C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: 'Gowun Dodum', 'Malgun Gothic', '맑은 고딕', sans-serif;
      color: var(--ink);
      background-color: var(--sky);
      background-image:
        radial-gradient(circle at 12% 6%,  rgba(255,255,255,0.75), transparent 40%),
        radial-gradient(circle at 92% 30%, rgba(143,196,230,0.45), transparent 42%),
        radial-gradient(circle at 10% 78%, rgba(245,239,230,0.95), transparent 45%),
        linear-gradient(170deg, var(--sky) 0%, var(--sky-mid) 45%, var(--cream) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.55;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 휴대폰 폭(390px)에 맞춘 가운데 영역 */
    .page { max-width: 390px; margin: 0 auto; padding: 40px 20px 56px; }

    /* 유리 카드 공통 (투명도·흐림·모서리·그림자) */
    .glass {
      background: rgba(245, 239, 230, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(63, 134, 184, 0.14);
    }

    /* ===== 1. 맨 위: 가게 이름과 안내 ===== */
    header { text-align: center; padding: 8px 0 28px; }
    header .badge {
      display: inline-block;
      font-size: 14px;
      color: #fff;
      background: var(--sky-strong);
      border-radius: 999px;
      padding: 5px 16px;
    }
    header h1 { font-size: 36px; font-weight: normal; letter-spacing: 2px; margin: 12px 0 8px; }
    header .rule { font-size: 16px; color: var(--ink-soft); }

    /* ===== 2. 번호 입력 ===== */
    .lookup { padding: 24px 22px 26px; margin-bottom: 24px; }
    .lookup[hidden] { display: none; }
    .notice { text-align: center; padding: 30px 22px; }
    .notice-title { font-size: 22px; margin-bottom: 10px; }
    .notice-text { font-size: 17px; color: var(--ink-soft); }
    .lookup label { display: block; font-size: 17px; margin-bottom: 10px; }
    .lookup input {
      width: 100%;
      min-height: 60px;
      text-align: center;
      font-family: inherit;
      font-size: 28px;
      letter-spacing: 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(63, 134, 184, 0.35);
      border-radius: 18px;
      outline: none;
    }
    .lookup input::placeholder { letter-spacing: 2px; font-size: 17px; color: #8da0ad; }
    .lookup input:focus { border-color: var(--sky-strong); box-shadow: 0 0 0 3px rgba(63, 134, 184, 0.2); }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 56px; margin-top: 14px;
      border: none; border-radius: 18px;
      font-family: inherit; font-size: 19px; color: #fff; cursor: pointer;
      background: var(--sky-strong);
      box-shadow: 0 8px 18px rgba(63, 134, 184, 0.35);
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .error { min-height: 22px; margin-top: 10px; text-align: center; font-size: 15px; color: #B3402F; }

    /* ===== 3. 스탬프 카드 ===== */
    .card { padding: 26px 22px 28px; text-align: center; }
    .card[hidden] { display: none; }
    .card .hello { font-size: 18px; margin-bottom: 18px; }

    /* 동그라미: 한 줄에 5개씩, 10개면 2줄이에요 */
    .stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 10px; margin-bottom: 22px; }
    .stamp {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      color: rgba(47, 74, 94, 0.35);
      background: rgba(255, 255, 255, 0.55);
      border: 2px dashed rgba(63, 134, 184, 0.4);
    }
    .stamp.filled {
      font-size: 26px;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: linear-gradient(145deg, #6FB1DB, var(--sky-strong));
      box-shadow: 0 6px 14px rgba(63, 134, 184, 0.4);
      animation: pop 0.4s ease backwards;
    }
    .stamp.reward { border-color: var(--gold); }   /* 마지막(보상) 동그라미 테두리 */
    @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .link-btn { margin-top: 16px; min-height: 48px; padding: 0 18px; border: none; background: none; font-family: inherit;
      font-size: 16px; color: var(--sky-strong); text-decoration: underline; cursor: pointer; }
    .count { font-size: 22px; margin-bottom: 6px; }
    .count strong { color: var(--sky-strong); }
    .note { font-size: 16px; color: var(--ink-soft); }

    /* ===== 축하 화면 ===== */
    .celebrate {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(47, 74, 94, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .celebrate[hidden] { display: none; }
    .celebrate .box { position: relative; width: 100%; max-width: 340px; padding: 36px 24px 28px; text-align: center; background: rgba(255, 252, 247, 0.92); overflow: hidden; }
    .celebrate .big { font-size: 64px; line-height: 1.1; animation: pop 0.5s ease backwards; }
    .celebrate h2 { font-size: 28px; font-weight: normal; margin: 10px 0 8px; }
    .celebrate .gift { font-size: 20px; color: var(--sky-strong); margin-bottom: 8px; }
    .celebrate .how { font-size: 15px; color: var(--ink-soft); margin-bottom: 4px; }
    .confetti { position: absolute; top: -20px; font-size: 22px; animation: fall 3s linear infinite; pointer-events: none; }
    @keyframes fall { to { transform: translateY(520px) rotate(360deg); opacity: 0.2; } }

    /* ===== 꽃가루 (화면 전체에 날려요) =====
       위의 .confetti / fall 은 예전(작은 상자 안) 방식이라 지금은 쓰지 않고 보관만 해요. */
    .confetti-layer {
      position: fixed; inset: 0; z-index: 60;
      overflow: hidden;
      pointer-events: none;      /* 꽃가루가 버튼 누르는 걸 방해하지 않게 */
    }
    .flake {
      position: absolute;
      top: 0;
      will-change: transform;
      animation-name: flake-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;   /* 축하 화면이 열려 있는 동안 계속 날려요 */
    }
    /* --dx: 옆으로 흔들리는 거리, --rot: 도는 각도 (조각마다 다르게 정해져요) */
    @keyframes flake-fall {
      0%   { transform: translate3d(0, -12vh, 0) rotate(0deg); }
      50%  { transform: translate3d(var(--dx), 50vh, 0) rotate(calc(var(--rot) / 2)); }
      100% { transform: translate3d(0, 112vh, 0) rotate(var(--rot)); }
    }

    /* 움직임을 줄여 달라고 설정한 휴대폰에서는 애니메이션을 끕니다 */
    @media (prefers-reduced-motion: reduce) {
      .stamp.filled, .celebrate .big, .confetti { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ===== 1. 맨 위 ===== -->
    <header>
      <span class="badge">단골 적립</span>
      <h1 id="shop-name"></h1>
      <p class="rule" id="rule"></p>
    </header>

    <!-- ===== 2. 번호 입력 ===== -->
    <!-- 손님 휴대폰처럼 사장님 기록이 없는 기기에서는 안내만 보여줘요 (아래 자바스크립트가 정해요) -->
    <section class="lookup glass notice" id="notice" hidden>
      <p class="notice-title">🙂 스탬프는 가게에서 확인해 드려요</p>
      <p class="notice-text">직원에게 휴대폰 번호 뒷 4자리를 말씀해 주세요.<br>바로 알려드릴게요!</p>
    </section>

    <section class="lookup glass" id="lookup">
      <label for="phone">휴대폰 번호 뒷 4자리</label>
      <input id="phone" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             autocomplete="off" placeholder="숫자 4자리">
      <button type="button" class="btn" id="check">확인</button>
      <p class="error" id="error" role="alert"></p>
    </section>

    <!-- ===== 3. 스탬프 카드 (확인을 누르면 나타나요) ===== -->
    <section class="card glass" id="card" hidden>
      <p class="hello" id="hello"></p>
      <div class="stamps" id="stamps"></div>
      <p class="count" id="count"></p>
      <p class="note" id="note"></p>
      <button type="button" class="link-btn" id="other">다른 번호로 확인하기</button>
    </section>

  </div>

  <!-- ===== 축하 화면 (스탬프를 다 모으면 나타나요) ===== -->
  <div class="celebrate" id="celebrate" hidden role="dialog" aria-modal="true" aria-label="축하해요">
    <div class="box glass">
      <p class="big">🎉</p>
      <h2>축하해요!</h2>
      <p class="gift" id="gift"></p>
      <p class="how">직원에게 이 화면을 보여 주세요.</p>
      <button type="button" class="btn" id="close">닫기</button>
    </div>
    <!-- 꽃가루가 날리는 층 (화면 전체를 덮어요. 자바스크립트가 채워 줘요) -->
    <div class="confetti-layer" id="confetti" aria-hidden="true"></div>
  </div>

  <script>
    /* ---------- 아래부터는 화면을 그리는 코드입니다. 보통은 건드리지 않아도 됩니다. ---------- */

    const 입력칸 = document.getElementById("phone");
    const 오류칸 = document.getElementById("error");
    const 카드 = document.getElementById("card");
    const 동그라미칸 = document.getElementById("stamps");
    const 축하화면 = document.getElementById("celebrate");

    // 맨 위 글자 채우기
    document.getElementById("shop-name").textContent = 가게이름;
    document.getElementById("rule").textContent = 적립방법 + " · " + 목표개수 + "개 모으면 " + 보상;
    document.title = 가게이름 + " 단골 적립";
    document.getElementById("gift").textContent = 보상;

    // 숫자만 입력되게 해요 (글자나 기호는 지워져요)
    입력칸.addEventListener("input", function () {
      입력칸.value = 입력칸.value.replace(/\D/g, "").slice(0, 4);
      오류칸.textContent = "";
    });

    // 동그라미 그리기: 모은 개수만큼 색이 채워져요
    function 동그라미그리기(개수) {
      동그라미칸.innerHTML = "";
      for (let i = 1; i <= 목표개수; i++) {
        const 원 = document.createElement("div");
        원.className = "stamp";
        if (i <= 개수) {
          원.classList.add("filled");
          원.textContent = "☕";
          원.style.animationDelay = (i * 0.06) + "s";   // 하나씩 차례로 나타나게
        } else {
          원.textContent = i;
        }
        if (i === 목표개수) 원.classList.add("reward");
        동그라미칸.appendChild(원);
      }
    }

    // 번호로 개수를 알아와요. 결과: { ok, 있음, 개수, 글 }
    // 이 기기에 사장님 기록이 있는지 확인하고, 있으면 기록(손님 목록)을 돌려줘요. 없으면 null
    function 기기기록읽기() {
      try {
        const 글 = localStorage.getItem(저장이름);
        if (!글) return null;
        const 데이터 = JSON.parse(글);
        return 데이터 && typeof 데이터 === "object" ? (데이터.손님 || {}) : null;
      } catch (e) {
        return null;
      }
    }

    async function 개수가져오기(번호) {
      if (서버주소.trim() === "") {
        if (연습모드) {
          // 연습 방식: 코드 맨 위의 가짜 손님 목록에서 찾아요 (목록에 없으면 처음 오신 손님 0개)
          const 있음 = Object.prototype.hasOwnProperty.call(연습손님, 번호);
          return { ok: true, 있음: 있음, 개수: Math.min(있음 ? 연습손님[번호] : 0, 목표개수) };
        }
        // 기기 방식: 이 기기에 저장된 사장님 기록에서 찾아요 (목록에 없으면 처음 오신 손님 0개)
        const 손님들 = 기기기록읽기();
        if (!손님들) return { ok: false, 글: "이 기기에서는 스탬프를 확인할 수 없어요. 직원에게 문의해 주세요." };
        const 있음 = Object.prototype.hasOwnProperty.call(손님들, 번호);
        return { ok: true, 있음: 있음, 개수: Math.min(Number(손님들[번호]) || 0, 목표개수) };
      }
      // 진짜 방식: 구글 장부 관리인에게 물어봐요 (번호가 인터넷 주소에 남지 않게 POST로 보내요)
      const 제어 = new AbortController();
      const 타이머 = setTimeout(function () { 제어.abort(); }, 12000);   // 12초 안에 답이 없으면 포기
      try {
        const 응답 = await fetch(서버주소.trim(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },   // (이렇게 보내야 구글이 막지 않아요)
          body: JSON.stringify({ action: "lookup", phone: 번호 }),
          cache: "no-store",
          signal: 제어.signal
        });
        const 자료 = await 응답.json();
        if (!자료.ok) return { ok: false, 글: 자료.reason === "busy" ? "조회가 많아요. 잠시 후 다시 눌러 주세요." : "확인하지 못했어요. 잠시 후 다시 해 주세요." };
        return { ok: true, 있음: !!자료.known, 개수: Math.min(Number(자료.count) || 0, 목표개수) };
      } catch (e) {
        return { ok: false, 글: "인터넷 연결을 확인하고 다시 눌러 주세요." };
      } finally {
        clearTimeout(타이머);
      }
    }

    let 확인중 = false;   // 확인하는 동안 버튼을 또 눌러도 한 번만 처리해요

    async function 확인() {
      if (확인중) return;
      const 번호 = 입력칸.value;
      if (!/^\d{4}$/.test(번호)) {
        오류칸.textContent = "숫자 4자리를 모두 입력해 주세요.";
        입력칸.focus();
        return;
      }

      확인중 = true;
      const 버튼 = document.getElementById("check");
      const 원래글 = 버튼.textContent;
      버튼.textContent = "확인하는 중…";
      버튼.disabled = true;
      const 결과 = await 개수가져오기(번호);
      버튼.textContent = 원래글;
      버튼.disabled = false;
      확인중 = false;

      if (!결과.ok) {
        오류칸.textContent = 결과.글;   // 입력한 번호는 그대로 둬서 다시 누르기만 하면 돼요
        return;
      }
      const 있음 = 결과.있음;
      const 개수 = 결과.개수;

      document.getElementById("hello").textContent = 있음 ? "내 스탬프 카드" : "처음 오셨네요! 환영해요 😊";
      동그라미그리기(개수);

      const 남은 = 목표개수 - 개수;
      if (개수 >= 목표개수) {
        document.getElementById("count").innerHTML = "<strong>" + 목표개수 + "개</strong>를 모두 모았어요!";
        document.getElementById("note").textContent = "축하해요! " + 보상 + "를 받을 수 있어요.";
      } else if (개수 === 0) {
        document.getElementById("count").innerHTML = "아직 <strong>0개</strong>예요";
        document.getElementById("note").textContent = 목표개수 + "개를 모으면 " + 보상 + "! (" + 적립방법 + ")";
      } else {
        document.getElementById("count").innerHTML = "<strong>" + 개수 + "개</strong> 모았어요!";
        document.getElementById("note").textContent = 남은 + "개 더 모으면 " + 보상;
      }

      카드.hidden = false;
      if (카드.scrollIntoView) 카드.scrollIntoView({ behavior: "smooth", block: "nearest" });
      입력칸.value = "";   // 번호는 화면에 남기지 않고 바로 지워요 (개인정보 보호)
      입력칸.blur();
      if (새로고침해도기억) { try { sessionStorage.setItem(기억이름, 번호); } catch (e) {} }   // 이 탭 안에서만, 탭을 닫으면 사라져요

      if (개수 >= 목표개수) 축하열기();
    }

    // ----- 꽃가루 설정 (숫자만 바꾸면 돼요) -----
    const 움직임줄이기를따를까 = false;   // false = 항상 날려요(지금 설정) / true = 기기에서 '움직임 줄이기'를 켠 손님에게는 멈춘 모양으로만 보여줘요
    const 꽃가루개수 = 90;                                  // 많이 날리게 하려면 숫자를 키우세요 (너무 크면 느려질 수 있어요)
    const 꽃가루색 = ["#3F86B8", "#6FB1DB", "#E9B44C", "#F28DA6", "#7BC8A4", "#FFFFFF", "#F5C26B"];
    const 이모지꽃가루 = ["🎊", "⭐", "☕", "✨"];            // 색종이 사이에 섞이는 그림

    function 랜덤(최소, 최대) { return 최소 + Math.random() * (최대 - 최소); }

    // 축하 화면: 화면 전체에 꽃가루를 날려요
    function 축하열기() {
      const 칸 = document.getElementById("confetti");
      칸.innerHTML = "";
      // 휴대폰·컴퓨터가 "움직임 줄이기(애니메이션 끄기)"로 설정돼 있어도 꽃가루는 항상 날리게 했어요.
      //  → 꽃가루가 멈춰 보이는 문제의 원인이 이 설정이었어요.
      //  → 움직임을 싫어하는 손님을 배려하고 싶으면 맨 위쪽 "움직임줄이기를따를까" 를 true 로 바꾸세요.
      const 움직임줄이기 = 움직임줄이기를따를까 && window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

      for (let i = 0; i < 꽃가루개수; i++) {
        const 조각 = document.createElement("span");
        조각.className = "flake";
        조각.style.left = 랜덤(0, 100) + "%";

        if (i % 9 === 0) {                                     // 아홉 개 중 하나는 그림(이모지)
          조각.textContent = 이모지꽃가루[i % 이모지꽃가루.length];
          조각.style.fontSize = 랜덤(18, 30) + "px";
        } else {                                               // 나머지는 색깔 색종이
          const 크기 = 랜덤(7, 14);
          조각.style.width = 크기 + "px";
          조각.style.height = 크기 * 랜덤(0.5, 1.8) + "px";
          조각.style.background = 꽃가루색[Math.floor(Math.random() * 꽃가루색.length)];
          조각.style.borderRadius = Math.random() < 0.3 ? "50%" : "2px";
        }

        if (움직임줄이기) {
          조각.style.animation = "none";
          조각.style.top = 랜덤(0, 95) + "%";
          조각.style.transform = "rotate(" + 랜덤(0, 360) + "deg)";
        } else {
          const 걸리는시간 = 랜덤(2.6, 5.2);                    // 한 번 떨어지는 데 걸리는 초
          조각.style.setProperty("--dx", 랜덤(-60, 60) + "px");
          조각.style.setProperty("--rot", 랜덤(360, 1080) * (Math.random() < 0.5 ? -1 : 1) + "deg");
          조각.style.animationDuration = 걸리는시간 + "s";
          조각.style.animationDelay = -랜덤(0, 걸리는시간) + "s";   // 마이너스 = 처음부터 이미 날리는 중
        }
        칸.appendChild(조각);
      }
      축하화면.hidden = false;
      document.getElementById("close").focus();
    }

    const 기억이름 = "bridgecafe-stamp-last4";

    // '다른 번호로 확인하기': 카드를 닫고 기억해 둔 번호도 지워요
    document.getElementById("other").addEventListener("click", function () {
      try { sessionStorage.removeItem(기억이름); } catch (e) {}
      카드.hidden = true;
      축하화면.hidden = true;
      입력칸.value = "";
      입력칸.focus();
    });

    // 사장님 기록이 없는 기기(= 손님 휴대폰)에서는 번호 입력칸 대신 안내만 보여줘요
    (function 안내확인() {
      if (서버주소.trim() === "" && !연습모드 && 기기기록읽기() === null) {
        document.getElementById("lookup").hidden = true;
        document.getElementById("notice").hidden = false;
      }
    })();

    // 새로고침했을 때: 방금 확인했던 번호가 이 탭에 있으면 최신 개수를 바로 보여줘요
    (function 처음에자동확인() {
      if (!새로고침해도기억) return;
      let 저장된 = null;
      try { 저장된 = sessionStorage.getItem(기억이름); } catch (e) {}
      if (저장된 && /^\d{4}$/.test(저장된)) { 입력칸.value = 저장된; 확인(); }
    })();

    document.getElementById("check").addEventListener("click", 확인);
    입력칸.addEventListener("keydown", function (e) { if (e.key === "Enter") 확인(); });
    document.getElementById("close").addEventListener("click", function () {
      축하화면.hidden = true;
      document.getElementById("confetti").innerHTML = "";   // 닫으면 꽃가루도 치워요
    });
  </script>
</body>
</html>
