<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>브릿지카페 사장님 화면</title>

  <!-- ╔════════════════════════════════════════════════════════════════╗
       ║  ★★★  사장님 전용 화면 설정  ★★★   고칠 때는 이 칸만 보세요!   ║
       ╚════════════════════════════════════════════════════════════════╝

       ■ ⚠ 꼭 지켜주세요 (보안 안내)
         1) 비밀번호는 이 파일 안에 그대로 적혀 있어서, 인터넷에 올리면 누구나 "소스 보기"로 알 수 있어요.
            그래서 비밀번호는 "화면 잠금" 정도로만 생각하세요.
            · 기록을 "이 기기 안에만" 저장하는 지금 방식에서는, 이 파일을 인터넷 주소에 올려도
              손님 기록이 새지 않아요. (기록은 사장님 기기 안에만 있어서, 다른 사람이 주소를 열어도 빈 화면이에요.)
            · 하지만 아래 "서버주소/사장님열쇠"를 쓰는 구글 방식에서는 절대 올리지 마세요!
            · ⚠ 항상 "같은 인터넷 주소, 같은 브라우저"로 여세요. 주소가 다르면 다른 장부가 돼서
              기록이 사라진 것처럼 보여요. (홈 화면에 바로가기를 추가해 두면 편해요.)
         2) 비밀번호 4자리는 약한 잠금이에요. 손님이 가까이에서 화면을 보지 못하게 하세요.
         3) 스탬프 기록을 저장하는 곳은 아래 "서버주소" 한 줄로 정해져요.
            · 서버주소가 비어 있으면("") → "이 기기의 이 브라우저 안에만" 저장돼요. (지금 설정)
              다른 기기에서는 보이지 않고, 브라우저의 "사이트 데이터 삭제"를 하면 기록이 사라져요.
              → 맨 아래 "기록 백업" 버튼으로 파일에 저장해 두세요. (백업 파일에는 손님 번호가 들어 있으니
                 인터넷에 올리거나 남에게 보내지 마세요.)
              손님 화면(index.html)은 "같은 주소에 두고 이 기기에서 열 때만" 이 기록을 읽어서 보여줘요.
            · 서버주소를 붙여넣으면 → 구글 스프레드시트 장부에 저장돼요.
              손님 화면(index.html)과 같은 기록을 보고, 사장님이 적립하면 손님이 새로고침할 때 바로 반영돼요.
              (서버주소·사장님열쇠 받는 법은 "구글시트 설정 안내.md")
            · "사장님열쇠"도 이 파일에 적히니, 이 파일은 더더욱 인터넷에 올리면 안 돼요!
         4) 손님 정보는 "번호 뒷 4자리"와 "스탬프 개수"만 저장해요. 이름 등은 받지 않아요.
            개수가 0이 되면 그 손님 기록은 지워져요.

       ■ 비밀번호 바꾸는 법
         아래 "사장님비밀번호" 줄의 큰따옴표 안 숫자 4개만 바꾸세요. 저장(Ctrl + S) 후 새로고침(F5).
       ═══════════════════════════════════════════════════════════════════ -->
  <script>
    /* ----- 설정 (큰따옴표 안의 글자, 숫자만 바꾸세요) ----- */
    const 사장님비밀번호 = "3201";      // ★ 숫자 4자리. 바꾸고 싶으면 여기만 고치세요
    const 가게이름       = "브릿지카페";
    const 목표개수       = 10;           // 몇 개를 모으면 무료 음료인지 (손님 화면과 같은 숫자로 맞추세요)
    const 틀린횟수한도   = 3;            // 비밀번호를 이만큼 틀리면 잠시 잠겨요
    const 잠금초         = 30;           // 잠기는 시간(초)
    const 저장이름       = "bridgecafe-stamp-admin-v1";   // 기록이 저장되는 이름 (바꾸면 기존 기록이 안 보여요!)

    /* ----- 구글 장부 연결 (지금은 쓰지 않아요. 두 줄 모두 비워 두세요) -----
       서버주소 : 구글 Apps Script 배포 후 나오는 "웹 앱 URL"
       사장님열쇠 : 서버코드.gs 에 적은 "사장님열쇠"와 똑같은 글자
       둘 다 비워 두면 "이 기기에만" 저장해요. */
    const 서버주소   = "";
    const 사장님열쇠 = "";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* ===== 색깔 설정 (손님 화면과 같은 색) ===== */
    :root {
      --sky:        #CFE8F7;
      --sky-mid:    #E3F1F8;
      --cream:      #F5EFE6;
      --sky-strong: #3F86B8;
      --ink:        #2F4A5E;
      --ink-soft:   #52697A;
      --green:      #2E9E6B;   /* 무료 음료 알림 / 성공 */
      --red:        #C4513C;   /* 오류 / 사용 완료 확인 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: 'Gowun Dodum', 'Malgun Gothic', '맑은 고딕', sans-serif;
      color: var(--ink);
      background-color: var(--sky);
      background-image:
        radial-gradient(circle at 12% 6%,  rgba(255,255,255,0.75), transparent 40%),
        radial-gradient(circle at 92% 30%, rgba(143,196,230,0.45), transparent 42%),
        radial-gradient(circle at 10% 78%, rgba(245,239,230,0.95), transparent 45%),
        linear-gradient(170deg, var(--sky) 0%, var(--sky-mid) 45%, var(--cream) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .page { max-width: 440px; margin: 0 auto; padding: 24px 16px 48px; }
    [hidden] { display: none !important; }

    .glass {
      background: rgba(245, 239, 230, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(63, 134, 184, 0.14);
    }

    /* ----- 맨 위 ----- */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .top h1 { font-size: 24px; font-weight: normal; }
    .top .tag { font-size: 14px; color: #fff; background: var(--ink); border-radius: 999px; padding: 3px 12px; margin-left: 8px; vertical-align: middle; }
    .lock-btn {
      min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid rgba(47,74,94,0.3);
      background: rgba(255,255,255,0.6); color: var(--ink); font-family: inherit; font-size: 16px; cursor: pointer;
    }

    /* ----- 입력칸 ----- */
    .field { width: 100%; min-height: 72px; text-align: center; font-family: inherit; font-size: 36px; letter-spacing: 14px;
      color: var(--ink); background: rgba(255,255,255,0.9); border: 2px solid rgba(63,134,184,0.4); border-radius: 20px; outline: none; }
    .field::placeholder { font-size: 20px; letter-spacing: 2px; color: #8da0ad; }
    .field:focus { border-color: var(--sky-strong); box-shadow: 0 0 0 4px rgba(63,134,184,0.2); }

    /* ----- 큰 버튼 (바쁠 때 빠르게 누르도록 크고 단순하게) ----- */
    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%;
      border: none; border-radius: 22px; font-family: inherit; color: #fff; cursor: pointer;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; }
    .btn.main   { min-height: 96px; font-size: 34px; background: var(--sky-strong); box-shadow: 0 10px 22px rgba(63,134,184,0.4); }  /* 적립 */
    .btn.sub    { min-height: 76px; font-size: 24px; color: var(--ink); background: rgba(255,255,255,0.8); border: 2px solid rgba(47,74,94,0.25); }  /* 취소 */
    .btn.use    { min-height: 76px; font-size: 24px; background: var(--green); box-shadow: 0 8px 18px rgba(46,158,107,0.35); }  /* 사용 완료 */
    .btn.use.confirm { background: var(--red); box-shadow: 0 8px 18px rgba(196,81,60,0.4); }
    .btn.look   { min-height: 60px; font-size: 20px; margin-top: 12px; color: var(--ink); background: rgba(255,255,255,0.55); border: 1.5px dashed rgba(47,74,94,0.35); }  /* 개수만 보기 */
    .btn.enter  { min-height: 76px; font-size: 26px; background: var(--sky-strong); margin-top: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

    /* ----- 안내 글 ----- */
    .msg { min-height: 30px; margin: 14px 4px 0; text-align: center; font-size: 19px; color: var(--ink-soft); }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--red); }

    /* ----- 로그인 카드 ----- */
    .login { padding: 28px 22px 26px; margin-top: 40px; text-align: center; }
    .login h2 { font-size: 24px; font-weight: normal; margin-bottom: 6px; }
    .login p.help { font-size: 16px; color: var(--ink-soft); margin-bottom: 16px; }

    /* ----- 작업 카드 / 결과 카드 ----- */
    .work { padding: 20px 18px 22px; }
    .result { padding: 20px 18px 22px; margin-top: 18px; text-align: center; }
    .result .who { font-size: 18px; color: var(--ink-soft); margin-bottom: 10px; }
    .stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 8px; margin-bottom: 14px; }
    .stamp { aspect-ratio: 1/1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: rgba(47,74,94,0.35); background: rgba(255,255,255,0.55); border: 2px dashed rgba(63,134,184,0.4); }
    .stamp.filled { font-size: 26px; color: #fff; border: 2px solid rgba(255,255,255,0.8);
      background: linear-gradient(145deg, #6FB1DB, var(--sky-strong)); box-shadow: 0 5px 12px rgba(63,134,184,0.4); }
    .count { font-size: 30px; }
    .count strong { color: var(--sky-strong); font-size: 40px; }

    /* 10개가 됐을 때 크게 뜨는 알림 */
    .free-alert { margin-bottom: 16px; padding: 18px 12px; border-radius: 20px; background: var(--green); color: #fff;
      font-size: 28px; line-height: 1.3; box-shadow: 0 10px 22px rgba(46,158,107,0.4); animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 50% { transform: scale(1.03); } }

    /* ----- 맨 아래: 오늘 횟수 ----- */
    .today { margin-top: 18px; padding: 18px; text-align: center; font-size: 20px; }
    .today strong { font-size: 36px; color: var(--sky-strong); margin: 0 4px; }
    .today .date { display: block; font-size: 14px; color: var(--ink-soft); }
    /* ----- 확인창 (실수 방지) ----- */
    .dialog-back { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(47,74,94,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .dialog { width: 100%; max-width: 400px; padding: 28px 20px 22px; text-align: center; background: rgba(255,252,247,0.95); }
    .dlg-title { font-size: 26px; margin-bottom: 10px; }
    .dlg-text { font-size: 19px; color: var(--ink-soft); white-space: pre-line; margin-bottom: 22px; }
    .dialog .btn.main { min-height: 76px; font-size: 24px; }   /* 확인창 안의 파란 버튼은 조금 작게 */

    /* 버튼이 꺼져 있을 때(번호가 4자리가 아닐 때): 눌러도 반응하지 않고 그림자도 없애요 */
    .btn:disabled { cursor: not-allowed; box-shadow: none; transform: none; }

    /* ----- 기록 백업 ----- */
    .backup { margin-top: 18px; padding: 18px; }
    .backup-title { font-size: 20px; margin-bottom: 4px; }
    .backup-help { font-size: 15px; color: var(--ink-soft); margin-bottom: 14px; }
    .backup .row { margin-top: 0; }
    .btn.small { min-height: 60px; font-size: 18px; }
    .backup-info { margin-top: 12px; font-size: 15px; color: var(--ink-soft); text-align: center; }
    .backup-info.warn { color: var(--red); }

    .foot-note { margin: 16px 6px 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
  </style>
</head>
<body>
  <div class="page">

    <!-- ===== 1단계: 비밀번호 입력 ===== -->
    <section class="login glass" id="login">
      <h2>사장님 화면</h2>
      <p class="help">비밀번호 4자리를 입력해 주세요.</p>
      <input class="field" id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             autocomplete="off" placeholder="비밀번호">
      <button type="button" class="btn enter" id="enter">들어가기</button>
      <p class="msg" id="login-msg" role="alert"></p>
    </section>

    <!-- ===== 2단계: 적립 화면 (비밀번호가 맞으면 나타나요) ===== -->
    <div id="app" hidden>

      <div class="top">
        <h1>사장님 화면<span class="tag" id="shop"></span></h1>
        <button type="button" class="lock-btn" id="lock">잠그기</button>
      </div>

      <section class="work glass">
        <input class="field" id="phone" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
               autocomplete="off" placeholder="손님 번호 뒷 4자리">

        <button type="button" class="btn main" id="add" style="margin-top:14px">적립</button>
        <div class="row">
          <button type="button" class="btn sub" id="cancel">취소 (-1)</button>
          <button type="button" class="btn use" id="done">사용 완료</button>
        </div>
        <!-- 아무것도 바꾸지 않고 "지금 몇 개인지"만 볼 때 -->
        <button type="button" class="btn look" id="look">개수만 보기</button>
        <p class="msg" id="msg" role="status"></p>
      </section>

      <!-- 방금 처리한 손님의 현재 상태 -->
      <section class="result glass" id="result" hidden>
        <!-- 10개가 되면 맨 위에 크게 떠요 (스크롤 없이 바로 보이게) -->
        <div class="free-alert" id="free" hidden>🎁 무료 음료 제공 대상입니다</div>
        <p class="who" id="who"></p>
        <div class="stamps" id="stamps"></div>
        <p class="count" id="count"></p>

      <section class="today glass">
        오늘 적립한 총 횟수 <strong id="today">0</strong>번
        <span class="date" id="date"></span>

      <!-- 기록 백업 (이 기기에만 저장하는 방식일 때만 보여요) -->

        <p class="backup-help">휴대폰을 바꾸거나 브라우저 데이터가 지워질 때를 대비해, 가끔 파일로 저장해 두세요.</p>

          <button type="button" class="btn sub small" id="export">백업 파일 저장</button>
          <button type="button" class="btn sub small" id="import">백업 파일 불러오기</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>

      </section>

      <p class="foot-note" id="foot">기록은 이 기기의 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 사라져요.</p>
    </div>

  </div>

  <!-- ===== 확인창 (1분 안에 또 적립 / 사용 완료 할 때 떠요) ===== -->
  <div class="dialog-back" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="dialog glass">
      <p class="dlg-title" id="dlg-title"></p>
      <p class="dlg-text" id="dlg-text"></p>
      <div class="row">
        <button type="button" class="btn sub" id="dlg-no">그만두기</button>
        <button type="button" class="btn main" id="dlg-yes">확인</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- 아래부터는 화면 동작 코드입니다. 보통은 건드리지 않아도 됩니다. ---------- */

    const $ = function (id) { return document.getElementById(id); };

    /* ===== 저장하고 불러오기 =====
       저장되는 모양: { 손님: { "1111": 3, ... }, 오늘: { 날짜: "2026-10-08", 횟수: 5, 기록: ["1111", ...] }, 잠금: { 틀림: 0, 풀리는시각: 0 } }
       - 손님: 번호 뒷 4자리 → 스탬프 개수
       - 오늘.기록: 오늘 '적립'한 번호들 (취소하면 오늘 횟수도 같이 줄이려고 써요) */
    let 저장가능 = true;
    let 메모리저장 = null;   // 저장이 막힌 브라우저에서 임시로 쓰는 공간

    function 오늘날짜() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function 빈데이터() {
      return { 손님: {}, 최근: {}, 오늘: { 날짜: 오늘날짜(), 횟수: 0, 기록: [] }, 잠금: { 틀림: 0, 풀리는시각: 0 } };
    }

    function 불러오기() {
      let 데이터 = null;
      try {
        const 글 = localStorage.getItem(저장이름);
        if (글) 데이터 = JSON.parse(글);
      } catch (e) {
        저장가능 = false;
        데이터 = 메모리저장;
      }
      if (!데이터 || typeof 데이터 !== "object") 데이터 = 빈데이터();
      데이터.손님 = 데이터.손님 || {};
      데이터.잠금 = 데이터.잠금 || { 틀림: 0, 풀리는시각: 0 };
      // 날짜가 바뀌면 '오늘' 횟수를 새로 시작해요
      if (!데이터.오늘 || 데이터.오늘.날짜 !== 오늘날짜()) 데이터.오늘 = { 날짜: 오늘날짜(), 횟수: 0, 기록: [] };
      return 데이터;
    }

    function 저장하기(데이터) {
      메모리저장 = 데이터;
      try {
        localStorage.setItem(저장이름, JSON.stringify(데이터));
        return true;
      } catch (e) {
        저장가능 = false;
        return false;
      }
    }

    /* ===== 비밀번호 확인 ===== */
    function 로그인알림(글, 오류) {
      $("login-msg").textContent = 글 || "";
      $("login-msg").className = "msg" + (오류 ? " err" : "");
    }

    function 잠금남은초() {
      const 데이터 = 불러오기();
      return Math.max(0, Math.ceil((데이터.잠금.풀리는시각 - Date.now()) / 1000));
    }

    let 잠금타이머 = null;
    function 잠금표시() {
      clearInterval(잠금타이머);
      const 갱신 = function () {
        const 남은 = 잠금남은초();
        if (남은 > 0) {
          로그인알림("비밀번호를 여러 번 틀렸어요. " + 남은 + "초 뒤에 다시 해 주세요.", true);
          $("enter").disabled = true;
        } else {
          clearInterval(잠금타이머);
          $("enter").disabled = false;
          if ($("login-msg").textContent.indexOf("초 뒤에") !== -1) 로그인알림("");
        }
      };
      갱신();
      if (잠금남은초() > 0) 잠금타이머 = setInterval(갱신, 500);
    }

    function 들어가기() {
      if (잠금남은초() > 0) { 잠금표시(); return; }
      const 입력 = $("pw").value;
      if (입력 === 사장님비밀번호) {
        const 데이터 = 불러오기();
        데이터.잠금 = { 틀림: 0, 풀리는시각: 0 };
        저장하기(데이터);
        try { sessionStorage.setItem(저장이름 + "-in", "1"); } catch (e) {}
        $("pw").value = "";
        화면열기();
      } else {
        const 데이터 = 불러오기();
        데이터.잠금.틀림 = (데이터.잠금.틀림 || 0) + 1;
        if (데이터.잠금.틀림 >= 틀린횟수한도) {
          데이터.잠금 = { 틀림: 0, 풀리는시각: Date.now() + 잠금초 * 1000 };
          저장하기(데이터);
          $("pw").value = "";
          잠금표시();
          return;
        }
        저장하기(데이터);
        로그인알림("비밀번호가 맞지 않아요. (" + 데이터.잠금.틀림 + "/" + 틀린횟수한도 + ")", true);
        $("pw").value = "";
        $("pw").focus();
      }
    }

    function 잠그기() {
      try { sessionStorage.removeItem(저장이름 + "-in"); } catch (e) {}
      $("app").hidden = true;
      $("login").hidden = false;
      $("result").hidden = true;
      $("phone").value = "";
      버튼상태();
      $("dlg").hidden = true;
      $("msg").textContent = "";
      로그인알림("");
      $("pw").focus();
    }

    function 화면열기() {
      $("login").hidden = true;
      $("app").hidden = false;
      $("shop").textContent = 가게이름;
      $("foot").textContent = 서버사용
        ? "기록은 구글 스프레드시트에 저장돼요. 손님 화면에서도 같은 기록을 봐요."
        : "기록은 이 기기의 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 사라져요.";
      $("backup").hidden = 서버사용;   // 구글 장부 방식에서는 백업 버튼이 필요 없어요
      if (!서버사용) 백업표시();
      오늘새로고침();
      버튼상태();
      if (!서버사용 && !저장가능) 알림("⚠ 이 브라우저에서는 저장이 막혀 있어요. 창을 닫으면 기록이 사라져요.", "err");
      $("phone").focus();
    }

    /* ===== 알림·화면 그리기 ===== */
    function 알림(글, 종류) {
      $("msg").textContent = 글 || "";
      $("msg").className = "msg" + (종류 ? " " + 종류 : "");
    }

    // 오늘 적립 횟수를 화면에 써요. 장부가 알려준 값({ 오늘, 날짜 })을 넘겨 주세요.
    function 오늘표시(자료) {
      if (!자료 || 자료.오늘 === undefined) return;
      $("today").textContent = 자료.오늘;
      $("date").textContent = 자료.날짜 + " 기준";
    }

    // 화면을 처음 열 때 오늘 횟수를 장부에서 가져와요
    async function 오늘새로고침() {
      const r = await 장부.오늘();
      if (r.ok) 오늘표시(r);
      else { $("today").textContent = "-"; 알림(오류글(r), "err"); }
    }

    function 결과그리기(번호, 개수) {
      $("result").hidden = false;
      $("who").textContent = "번호 뒷자리 " + 번호;
      const 칸 = $("stamps");
      칸.innerHTML = "";
      for (let i = 1; i <= 목표개수; i++) {
        const 원 = document.createElement("div");
        원.className = "stamp" + (i <= 개수 ? " filled" : "");
        원.textContent = i <= 개수 ? "☕" : i;
        칸.appendChild(원);
      }
      $("count").innerHTML = "지금 <strong>" + 개수 + "개</strong>";
      $("free").hidden = 개수 < 목표개수;   // 10개가 되면 큰 알림
    }

    function 번호읽기() {
      const 번호 = $("phone").value;
      if (!/^\d{4}$/.test(번호)) {
        알림("손님 번호 뒷 4자리를 모두 입력해 주세요.", "err");
        $("phone").focus();
        return null;
      }
      return 번호;
    }

    function 번호선택() {   // 다음 번호를 바로 덮어쓸 수 있게 글자를 선택해 둬요
      $("phone").focus();
      $("phone").select();
    }

    function 사용완료확인끄기() {
      clearTimeout(확인타이머);
      $("done").classList.remove("confirm");
      $("done").textContent = "사용 완료";
      확인중 = false;
    }

    /* ===== 확인창 (실수 방지용 큰 창) =====
       - 확인창이 떠 있는 동안에는 뒤 화면이 눌리지 않아요.
       - 처음에는 "안전한 쪽(그만두기)" 버튼에 커서가 가 있어서, 급하게 엔터를 눌러도 실수로 진행되지 않아요.
       - 창 바깥 어두운 곳을 누르거나 Esc 키를 누르면 "그만두기"와 같아요. */
    let 확인창_할일 = null;   // '확인'을 눌렀을 때 실행할 일

    function 확인창열기(제목, 글, 확인글, 그만글, 확인색, 할일) {
      $("dlg-title").textContent = 제목;
      $("dlg-text").textContent = 글;
      $("dlg-yes").textContent = 확인글;
      $("dlg-no").textContent = 그만글;
      $("dlg-yes").className = "btn " + 확인색;   // main = 파란색, use = 초록색
      확인창_할일 = 할일;
      $("dlg").hidden = false;
      $("dlg-no").focus();
    }

    function 확인창닫기() {
      $("dlg").hidden = true;
      확인창_할일 = null;
      번호선택();
    }

    $("dlg-yes").addEventListener("click", function () {
      const 할일 = 확인창_할일;
      $("dlg").hidden = true;
      확인창_할일 = null;
      if (할일) 할일();
    });
    $("dlg-no").addEventListener("click", 확인창닫기);
    $("dlg").addEventListener("click", function (e) { if (e.target === $("dlg")) 확인창닫기(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("dlg").hidden) 확인창닫기(); });

    /* ===== 번호가 4자리가 아니면 버튼이 안 눌리게 =====
       적립 / 취소 / 사용 완료 / 개수만 보기 버튼은 번호 4자리가 모두 입력돼야 켜져요.
       (처리 중일 때도 잠시 꺼져서, 급하게 두 번 눌러도 한 번만 처리돼요.) */
    let 처리중 = false;
    function 버튼상태() {
      const 됐나 = /^\d{4}$/.test($("phone").value);
      ["add", "cancel", "done", "look"].forEach(function (id) { $(id).disabled = !됐나 || 처리중; });
    }

    /* ===== 1분 안에 같은 손님에게 또 적립하는 걸 막는 기준 (이 기기 저장 방식에서 쓰여요.
       구글 장부 방식에서는 서버코드.gs 의 '중복확인_초' 가 같은 일을 해요) ===== */
    const 중복확인_밀리초 = 60 * 1000;   // 60초 (바꾸려면 숫자만 고치세요. 예: 2분 = 120 * 1000)

    function 최근정리(데이터) {   // 1분이 지난 '방금 적립' 기록은 지워요
      데이터.최근 = 데이터.최근 || {};
      Object.keys(데이터.최근).forEach(function (번호) {
        if (Date.now() - 데이터.최근[번호] >= 중복확인_밀리초) delete 데이터.최근[번호];
      });
    }

    /* ===== 장부: 스탬프 기록을 읽고 쓰는 곳 =====
       "장부"는 두 가지 방식이 있고, 맨 위 설정의 서버주소가 비어 있는지로 정해져요.
         · 기기장부: 이 기기·이 브라우저 안에 저장 (예전 방식, 서버주소가 비었을 때)
         · 서버장부: 구글 스프레드시트에 저장 (서버주소를 붙여넣었을 때)
       두 장부는 같은 모양으로 답해요: { ok, 이유, 개수, 오늘, 날짜, 글 }
       이유 = "가득" | "방금" | "0개" | "모자람" | "열쇠" | "연결" | "바쁨" | "잘못" */
    const 서버사용 = 서버주소.trim() !== "";

    const 기기장부 = {
      async 오늘() {
        const 데이터 = 불러오기();
        return { ok: true, 오늘: 데이터.오늘.횟수, 날짜: 데이터.오늘.날짜 };
      },
      async 상태(번호) {
        const 데이터 = 불러오기();
        return { ok: true, 개수: 데이터.손님[번호] || 0, 오늘: 데이터.오늘.횟수, 날짜: 데이터.오늘.날짜 };
      },
      async 적립(번호, 확정) {
        const 데이터 = 불러오기();
        const 지금 = 데이터.손님[번호] || 0;
        if (지금 >= 목표개수) return { ok: false, 이유: "가득", 개수: 지금 };
        최근정리(데이터);
        if (!확정 && 데이터.최근[번호]) return { ok: false, 이유: "방금", 개수: 지금 };
        데이터.손님[번호] = 지금 + 1;
        데이터.오늘.횟수 += 1;
        데이터.오늘.기록.push(번호);
        데이터.최근[번호] = Date.now();   // '방금 적립' 시각을 기억해 둬요
        const 저장됨 = 저장하기(데이터);
        return { ok: true, 개수: 데이터.손님[번호], 오늘: 데이터.오늘.횟수, 날짜: 데이터.오늘.날짜, 저장실패: !저장됨 };
      },
      async 취소(번호) {
        const 데이터 = 불러오기();
        const 지금 = 데이터.손님[번호] || 0;
        if (지금 <= 0) return { ok: false, 이유: "0개", 개수: 0 };
        const 새 = 지금 - 1;
        if (새 === 0) delete 데이터.손님[번호]; else 데이터.손님[번호] = 새;
        // 오늘 이 번호로 적립한 기록이 있으면 오늘 횟수도 같이 줄여요
        const 위치 = 데이터.오늘.기록.lastIndexOf(번호);
        if (위치 !== -1) {
          데이터.오늘.기록.splice(위치, 1);
          데이터.오늘.횟수 = Math.max(0, 데이터.오늘.횟수 - 1);
        }
        // 잘못 넣은 걸 되돌린 거니까, 곧바로 다시 적립해도 '방금 적립' 확인창이 뜨지 않게 해요
        if (데이터.최근) delete 데이터.최근[번호];
        저장하기(데이터);
        return { ok: true, 개수: 새, 오늘: 데이터.오늘.횟수, 날짜: 데이터.오늘.날짜 };
      },
      async 사용(번호) {
        const 데이터 = 불러오기();
        const 지금 = 데이터.손님[번호] || 0;
        if (지금 < 목표개수) return { ok: false, 이유: "모자람", 개수: 지금 };
        delete 데이터.손님[번호];   // 0개로 초기화 (기록도 지워요)
        if (데이터.최근) delete 데이터.최근[번호];
        저장하기(데이터);
        return { ok: true, 개수: 0, 오늘: 데이터.오늘.횟수, 날짜: 데이터.오늘.날짜 };
      }
    };

    // 구글 장부 관리인에게 부탁하고 답을 받아요 (15초 안에 답이 없으면 '연결 안 됨'으로 봐요)
    async function 서버호출(내용) {
      const 제어 = new AbortController();
      const 타이머 = setTimeout(function () { 제어.abort(); }, 15000);
      try {
        const 응답 = await fetch(서버주소.trim(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },   // (이렇게 보내야 구글이 막지 않아요)
          body: JSON.stringify(Object.assign({ key: 사장님열쇠 }, 내용)),
          cache: "no-store",
          signal: 제어.signal
        });
        return await 응답.json();
      } catch (e) {
        return { ok: false, reason: "network" };
      } finally {
        clearTimeout(타이머);
      }
    }

    // 서버의 답(영어 이름)을 화면에서 쓰는 모양(한글 이름)으로 바꿔요
    function 서버답변바꾸기(j) {
      if (j && j.ok) return { ok: true, 개수: j.count, 오늘: j.today, 날짜: j.date };
      const 이름표 = { full: "가득", recent: "방금", zero: "0개", notfull: "모자람", auth: "열쇠", network: "연결", busy: "바쁨", bad: "잘못" };
      return { ok: false, 이유: 이름표[j && j.reason] || "잘못", 개수: j && j.count, 글: j && j.msg };
    }

    const 서버장부 = {
      async 오늘()       { return 서버답변바꾸기(await 서버호출({ action: "today" })); },
      async 상태(번호)   { return 서버답변바꾸기(await 서버호출({ action: "status", phone: 번호 })); },
      async 적립(번호, 확정) { return 서버답변바꾸기(await 서버호출({ action: "add", phone: 번호, confirmed: !!확정 })); },
      async 취소(번호)   { return 서버답변바꾸기(await 서버호출({ action: "cancel", phone: 번호 })); },
      async 사용(번호)   { return 서버답변바꾸기(await 서버호출({ action: "use", phone: 번호 })); }
    };

    const 장부 = 서버사용 ? 서버장부 : 기기장부;

    // 오류 때 사장님께 보여줄 글
    function 오류글(r) {
      if (r.이유 === "연결") return "인터넷 연결이 안 돼요. 처리됐는지 확실하지 않아요. '개수만 보기'로 확인해 주세요.";
      if (r.이유 === "열쇠") return "사장님 열쇠가 맞지 않아요. admin.html 설정의 '사장님열쇠'를 확인하세요.";
      return r.글 || "처리하지 못했어요. 잠시 후 다시 눌러 주세요.";
    }

    // 버튼을 누르면 한 번에 하나만 처리해요
    async function 실행(할일) {
      if (처리중) return;
      처리중 = true;
      버튼상태();
      알림("처리 중…");
      try {
        await 할일();
      } finally {
        처리중 = false;
        버튼상태();
      }
    }

    /* ===== 버튼 동작 ===== */
    function 적립() {
      사용완료확인끄기();
      const 번호 = 번호읽기();
      if (!번호) return;
      실행(function () { return 적립요청(번호, false); });
    }

    async function 적립요청(번호, 확정) {
      const r = await 장부.적립(번호, 확정);
      if (!r.ok) {
        if (r.이유 === "가득") {
          결과그리기(번호, r.개수);
          알림("이미 " + 목표개수 + "개예요. 무료 음료를 드린 뒤 '사용 완료'를 눌러 주세요.", "err");
        } else if (r.이유 === "방금") {
          // 1분 안에 같은 번호로 또 적립하려고 하면 먼저 물어봐요
          알림("");
          확인창열기("잠깐만요!", "방금 적립했습니다. 계속할까요?\n(번호 뒷자리 " + 번호 + ")", "계속 적립", "그만두기", "main", function () {
            실행(function () { return 적립요청(번호, true); });
          });
          return;
        } else {
          알림(오류글(r), "err");
        }
        번호선택();
        return;
      }
      결과그리기(번호, r.개수);
      오늘표시(r);
      if (r.개수 >= 목표개수) {
        알림("🎁 무료 음료 제공 대상입니다!", "ok");
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      } else {
        알림("적립했어요! (" + r.개수 + "개)", "ok");
      }
      if (r.저장실패) 알림("⚠ 저장이 안 됐어요. 창을 닫으면 기록이 사라져요.", "err");
      번호선택();
    }

    function 취소() {
      사용완료확인끄기();
      const 번호 = 번호읽기();
      if (!번호) return;
      실행(async function () {
        const r = await 장부.취소(번호);
        if (!r.ok) {
          if (r.이유 === "0개") {
            결과그리기(번호, 0);
            알림("이 번호는 스탬프가 0개라서 뺄 게 없어요.", "err");
          } else {
            알림(오류글(r), "err");
          }
          번호선택();
          return;
        }
        결과그리기(번호, r.개수);
        오늘표시(r);
        알림("취소했어요. (" + r.개수 + "개)", "ok");
        번호선택();
      });
    }

    // 개수만 보기: 아무것도 바꾸지 않고 지금 개수만 보여줘요
    function 조회() {
      사용완료확인끄기();
      const 번호 = 번호읽기();
      if (!번호) return;
      실행(async function () {
        const r = await 장부.상태(번호);
        if (!r.ok) { 알림(오류글(r), "err"); 번호선택(); return; }
        결과그리기(번호, r.개수);
        오늘표시(r);
        알림("지금 " + r.개수 + "개예요.", "ok");
        번호선택();
      });
    }

    // 사용 완료: 확인창에서 "네, 사용 완료"를 눌러야 0개로 초기화돼요
    let 확인중 = false;        // (예전 '두 번 누르기' 방식에서 쓰던 값. 보관만 해요)
    let 확인타이머 = null;
    function 사용완료() {
      const 번호 = 번호읽기();
      if (!번호) return;
      실행(async function () {
        const s = await 장부.상태(번호);   // 먼저 지금 개수를 확인해요
        if (!s.ok) { 알림(오류글(s), "err"); 번호선택(); return; }
        if (s.개수 < 목표개수) {
          사용완료확인끄기();
          결과그리기(번호, s.개수);
          알림("아직 " + 목표개수 + "개가 아니에요. (" + s.개수 + "개)", "err");
          번호선택();
          return;
        }
        알림("");
        확인창열기("무료 음료를 드렸나요?", "번호 뒷자리 " + 번호 + " 손님의 스탬프가 0개로 초기화됩니다.\n되돌릴 수 없어요.", "네, 사용 완료", "아니요", "use", function () {
          실행(async function () {
            const r = await 장부.사용(번호);
            if (!r.ok) { 알림(오류글(r), "err"); 번호선택(); return; }
            결과그리기(번호, 0);
            오늘표시(r);
            알림("사용 완료! 0개로 초기화했어요.", "ok");
            번호선택();
          });
        });
      });

      /* ── 예전 방식(보관용): 버튼을 4초 안에 두 번 눌러야 초기화되던 코드. 지금은 확인창이 대신해서 쓰지 않아요.
      if (!확인중) {
        확인중 = true;
        $("done").classList.add("confirm");
        $("done").textContent = "정말요? 한 번 더!";
        알림("무료 음료를 드렸다면 한 번 더 눌러 주세요.");
        clearTimeout(확인타이머);
        확인타이머 = setTimeout(function () { 사용완료확인끄기(); 알림(""); }, 4000);
        return;
      }
      ── */
    }

    /* ===== 기록 백업 (이 기기에만 저장하는 방식일 때) =====
       · 백업 파일 저장: 지금 기록을 파일(.json)로 내려받아요. 파일에는 "번호 뒷 4자리와 개수"만 들어 있어요.
       · 백업 파일 불러오기: 저장해 둔 파일로 기록을 되돌려요. (지금 기록은 파일 내용으로 바뀌어요)
       ⚠ 백업 파일에는 손님 번호가 들어 있으니 인터넷에 올리거나 남에게 보내지 마세요. */
    function 백업표시() {
      const 데이터 = 불러오기();
      const 칸 = $("backup-info");
      const 손님수 = Object.keys(데이터.손님).length;
      const 날짜 = 데이터.백업날짜;
      let 오래됨 = !날짜;
      if (날짜) 오래됨 = (Date.now() - new Date(날짜 + "T00:00:00").getTime()) > 7 * 86400000;
      if (손님수 > 0 && 오래됨) {
        칸.textContent = (날짜 ? "⚠ 마지막 백업이 " + 날짜 + "이에요. 한 번 더 저장해 두세요." : "⚠ 아직 백업한 적이 없어요. 한 번 저장해 두세요.");
        칸.className = "backup-info warn";
      } else {
        칸.textContent = 날짜 ? "마지막 백업: " + 날짜 : "아직 백업한 적이 없어요.";
        칸.className = "backup-info";
      }
    }

    function 백업저장() {
      const 데이터 = 불러오기();
      const 내용 = { 종류: "브릿지카페-스탬프-백업", 버전: 1, 저장날짜: 오늘날짜(), 목표개수: 목표개수, 손님: 데이터.손님 };
      const 파일 = new Blob([JSON.stringify(내용, null, 1)], { type: "application/json" });
      const 주소 = URL.createObjectURL(파일);
      const 링크 = document.createElement("a");
      링크.href = 주소;
      링크.download = "브릿지카페-스탬프-백업-" + 오늘날짜() + ".json";   // 저장될 파일 이름 (고쳐도 돼요)
      document.body.appendChild(링크);
      링크.click();
      링크.remove();
      setTimeout(function () { URL.revokeObjectURL(주소); }, 1000);
      데이터.백업날짜 = 오늘날짜();
      저장하기(데이터);
      백업표시();
      알림("백업 파일을 저장했어요. (다운로드 폴더를 확인하세요)", "ok");
    }

    // 백업 파일 내용이 올바른지 꼼꼼히 확인해요 (잘못된 파일로 기록이 망가지지 않게)
    function 백업검사(내용) {
      if (!내용 || 내용.종류 !== "브릿지카페-스탬프-백업" || !내용.손님 || typeof 내용.손님 !== "object" || Array.isArray(내용.손님)) return null;
      const 깨끗 = {};
      const 번호들 = Object.keys(내용.손님);
      for (let i = 0; i < 번호들.length; i++) {
        const 개수 = 내용.손님[번호들[i]];
        if (!/^\d{4}$/.test(번호들[i]) || !Number.isInteger(개수) || 개수 < 0 || 개수 > 목표개수) return null;
        if (개수 > 0) 깨끗[번호들[i]] = 개수;
      }
      return 깨끗;
    }

    function 백업불러오기(파일) {
      if (!파일) return;
      const 읽기 = new FileReader();
      읽기.onload = function () {
        let 내용 = null;
        try { 내용 = JSON.parse(읽기.result); } catch (e) {}
        const 새손님 = 백업검사(내용);
        if (!새손님) { 알림("이 파일은 백업 파일이 아니거나 내용이 올바르지 않아요.", "err"); return; }
        const 지금수 = Object.keys(불러오기().손님).length;
        const 새수 = Object.keys(새손님).length;
        확인창열기("백업 파일로 바꿀까요?", "지금 기록(" + 지금수 + "명)이 백업 파일의 기록(" + 새수 + "명)으로 바뀝니다.\n되돌릴 수 없어요.", "네, 불러오기", "아니요", "use", function () {
          const 데이터 = 불러오기();
          데이터.손님 = 새손님;
          데이터.최근 = {};
          const 성공 = 저장하기(데이터);
          $("result").hidden = true;
          백업표시();
          알림(성공 ? "백업 파일을 불러왔어요. (" + 새수 + "명)" : "⚠ 저장이 안 됐어요.", 성공 ? "ok" : "err");
        });
      };
      읽기.onerror = function () { 알림("파일을 읽지 못했어요.", "err"); };
      읽기.readAsText(파일);
    }

    /* ===== 연결하기 ===== */
    ["phone", "pw"].forEach(function (id) {
      $(id).addEventListener("input", function () {
        $(id).value = $(id).value.replace(/\D/g, "").slice(0, 4);
        if (id === "phone") { 알림(""); 사용완료확인끄기(); 버튼상태(); }
      });
    });
    $("enter").addEventListener("click", 들어가기);
    $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") 들어가기(); });
    $("phone").addEventListener("keydown", function (e) { if (e.key === "Enter") 적립(); });
    $("add").addEventListener("click", 적립);
    $("cancel").addEventListener("click", 취소);
    $("done").addEventListener("click", 사용완료);
    $("look").addEventListener("click", 조회);
    $("export").addEventListener("click", 백업저장);
    $("import").addEventListener("click", function () { $("import-file").click(); });
    $("import-file").addEventListener("change", function () {
      백업불러오기($("import-file").files[0]);
      $("import-file").value = "";   // 같은 파일을 다시 골라도 동작하게 비워 둬요
    });
    $("lock").addEventListener("click", 잠그기);

    // 처음 열 때: 이미 비밀번호를 넣었던 창이면 바로 들어가요 (창을 닫으면 다시 물어봐요)
    (function 시작() {
      document.title = 가게이름 + " 사장님 화면";
      let 이미 = false;
      try { 이미 = sessionStorage.getItem(저장이름 + "-in") === "1"; } catch (e) {}
      if (이미) 화면열기(); else { 잠금표시(); }
    })();
  </script>
</body>
</html>
